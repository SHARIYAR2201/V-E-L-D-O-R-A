services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: veldora, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set in .env}", POSTGRES_DB: veldora }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U veldora"], interval: 5s, retries: 10 }
  redis:
    image: redis:7
  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    environment:
      VELDORA_DATABASE_URL: "postgresql+psycopg://veldora:${POSTGRES_PASSWORD}@db:5432/veldora"
      VELDORA_REDIS_URL: redis://redis:6379/0
      VELDORA_JWT_SECRET: "${JWT_SECRET:?set in .env}"
      VELDORA_CORS_ORIGINS: http://localhost:3000
      VELDORA_ADMIN_EMAILS: "${ADMIN_EMAILS:-}"
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_started } }
    ports: ["8000:8000"]
  web:
    build: { context: ., dockerfile: frontend/Dockerfile }
    depends_on: [api]
    ports: ["3000:3000"]
volumes: { pgdata: {} }
